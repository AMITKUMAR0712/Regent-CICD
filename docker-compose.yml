services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: party_space_booking
      MYSQL_USER: party_app
      MYSQL_PASSWORD: party_app_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
